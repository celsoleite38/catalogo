{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link inválido - Catálogo Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-md p-8 text-center">
        <div class="w-16 h-16 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>

        <h1 class="text-xl font-bold text-gray-800 mb-2">Link inválido ou expirado</h1>
        <p class="text-sm text-gray-500 mb-6">
            Este link de confirmação expirou ou já foi utilizado. Solicite um novo link informando seu email.
        </p>

        <a href="{% url 'usuarios:reenviar' %}" class="inline-block w-full bg-green-700 text-white font-semibold py-2.5 rounded-lg hover:bg-green-800 transition">
            Reenviar link
        </a>
    </div>

</body>
</html>
