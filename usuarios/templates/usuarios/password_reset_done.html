{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email enviado - Catálogo Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-md p-8 text-center">
        <div class="w-16 h-16 rounded-full bg-green-100 text-green-700 flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
        </div>

        <h1 class="text-xl font-bold text-gray-800 mb-2">Verifique seu email</h1>
        <p class="text-sm text-gray-500 mb-6">
            Se existir uma conta com esse email, enviaremos um link para redefinir sua senha. Verifique sua caixa de entrada (e também o spam).
        </p>

        <a href="{% url 'catalogo:login' %}" class="inline-block w-full bg-green-700 text-white font-semibold py-2.5 rounded-lg hover:bg-green-800 transition">
            Voltar para o login
        </a>
    </div>

</body>
</html>
