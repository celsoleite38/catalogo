<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ lojista.nome_loja }} — Indisponível</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="text-center max-w-md">
        {% if lojista.logo %}
            <img src="{{ lojista.logo.url }}" alt="{{ lojista.nome_loja }}"
                 class="w-20 h-20 rounded-full object-cover object-center mx-auto mb-6">
        {% else %}
            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <span class="text-2xl font-bold text-red-500">{{ lojista.nome_loja|first|upper }}</span>
            </div>
        {% endif %}
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Loja fora do ar</h1>
        <p class="text-gray-500 mb-2">O catálogo de <strong>{{ lojista.nome_loja }}</strong> está pausado no momento.</p>
        <p class="text-sm text-gray-400">Se você é o responsável por esta loja, regularize a assinatura para publicá-la novamente.</p>
    </div>
</body>
</html>
