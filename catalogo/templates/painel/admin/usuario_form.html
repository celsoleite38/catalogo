<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Novo Usuário</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-gray-900 text-white px-6 py-4 flex justify-between items-center">
        <h1 class="font-bold text-lg">Novo Usuário</h1>
        <a href="{% url 'catalogo:admin_usuarios' %}" class="text-sm text-gray-300 hover:text-white">← Voltar</a>
    </nav>

    <main class="max-w-md mx-auto mt-8 p-4">
        <div class="bg-white p-6 rounded-xl shadow-sm border">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Usuário *</label>
                    <input type="text" name="username" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Email</label>
                    <input type="email" name="email" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Senha *</label>
                    <input type="password" name="senha" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
                    Criar Usuário
                </button>
            </form>
        </div>
    </main>
</body>
</html>
